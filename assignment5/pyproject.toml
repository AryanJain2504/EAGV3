[project]
name = "aegisops"
version = "0.1.0"
description = "Autonomous Cyber Incident Triage & Threat Mitigation Orchestrator using LLM Gateway and Pydantic V2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
