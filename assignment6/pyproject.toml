[project]
name = "agent6-mpda"
version = "0.1.0"
description = "EAG V3 Assignment 6: Memory-Perception-Decision-Action agent loop over MCP stdio + LLM Gateway V3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "mcp>=1.0.0,<2",
    "ddgs>=9.0.0",
    "tavily-python>=0.5.0",
    "crawl4ai>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
